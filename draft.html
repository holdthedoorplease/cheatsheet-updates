<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DRAFT — Updates</title>
<base target="_blank">
<style>
  * { box-sizing: border-box; }
  body { font-family: Arial, sans-serif; font-size: 14px; line-height: 1.6; margin: 0; color: #222; background: #f9f9f9; }
  .page { display: flex; max-width: 1100px; margin: 40px auto; padding: 0 20px; gap: 0; }

  .sidebar { width: 180px; flex-shrink: 0; position: sticky; top: 40px; align-self: flex-start; padding-right: 20px; }
  .sidebar h4 { font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: #999; margin: 0 0 8px 0; }
  .sidebar a { display: block; padding: 5px 10px; font-size: 13px; color: #1a3a5c; text-decoration: none; border-left: 3px solid #e0e0e0; margin-bottom: 2px; }
  .sidebar a:hover { border-left-color: #1a3a5c; background: #eef2f7; }

  .main { flex: 1; min-width: 0; background: #fff; border: 1px solid #e0e0e0; border-radius: 8px; padding: 28px 32px; }

  h1 { font-size: 20px; color: #1a3a5c; margin: 0 0 4px 0; }
  .draft-banner { background: #fff3cd; border: 1px solid #ffc107; border-radius: 6px; padding: 10px 16px; font-size: 13px; color: #856404; margin-bottom: 24px; }
  .last-updated { font-size: 12px; color: #aaa; margin-bottom: 28px; }
  .divider { border: none; border-top: 1px solid #eee; margin: 0 0 24px 0; }

  .board { border: 1px solid #d0d8e4; border-radius: 6px; padding: 22px 26px; margin-bottom: 20px; background: #fafcff; scroll-margin-top: 40px; }
  .board h3 { font-size: 15px; color: #1a3a5c; margin: 0 0 4px 0; }
  .entry-meta { font-size: 12px; color: #666; margin-bottom: 18px; padding-bottom: 14px; border-bottom: 1px solid #dde3eb; }
  .sub-label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.07em; color: #222; font-weight: 600; margin: 20px 0 8px 0; }
  .sub-label::before { content: "• "; }
  .update-img { max-width: 100%; border: 1px solid #dde3eb; border-radius: 4px; display: block; }
  .section-label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: #999; margin: 28px 0 12px 0; }

  p { margin: 10px 0; }
  table { border-collapse: collapse; width: 100%; margin: 14px 0; }
  th, td { border: 1px solid #bbb; padding: 8px 12px; text-align: left; vertical-align: middle; }
  th { background-color: #f0f0f0; font-weight: bold; }
  tr:nth-child(even) td { background: #f4f4f4; }

  .row-added td { background: #e6f4ea !important; }

  .pending-img { background: #f5f5f5; border: 1px dashed #ccc; border-radius: 4px; padding: 20px; text-align: center; font-size: 13px; color: #999; font-style: italic; }

  blockquote { margin: 12px 0; padding: 10px 16px; border-left: 3px solid #d0d8e4; background: #f4f7fb; color: #444; font-style: italic; }

  footer { margin-top: 32px; font-size: 11px; color: #bbb; text-align: right; }
</style>
</head>
<body>
<div class="page">

  <aside class="sidebar">
    <h4>Draft</h4>
    <!-- add sidebar links here -->
  </aside>

  <div class="main">

    <h1>DRAFT — Proposed Updates</h1>
    <p class="last-updated">For review only — not yet published</p>

    <div class="draft-banner">
      ⚠️ Working draft for Henry's review. Once confirmed, merge into standard-en.html or plus-source.html, run build-plus.py, push, then clear this file back to the blank template.
    </div>

    <hr class="divider">

    <!-- add update entries here -->

    <footer>DRAFT — for Henry's review only</footer>
  </div>

</div>
</body>
</html>
