<title>Updates of THE EPE CHEATSHEET (Plus Edition)</title>
<base target="_blank">
<style>
  * { box-sizing: border-box; }
  body { font-family: Arial, sans-serif; font-size: 14px; line-height: 1.6; margin: 0; color: #222; background: #f9f9f9; }
  .page { display: flex; max-width: 1100px; margin: 40px auto; padding: 0 20px; gap: 0; }

  .sidebar { width: 180px; flex-shrink: 0; position: sticky; top: 40px; align-self: flex-start; padding-right: 20px; }
  .sidebar h4 { font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: #999; margin: 0 0 8px 0; }
  .sidebar h4.section { margin-top: 16px; }
  .sidebar a { display: block; padding: 5px 10px; font-size: 13px; color: #1a3a5c; text-decoration: none; border-left: 3px solid #e0e0e0; margin-bottom: 2px; }
  .sidebar a:hover { border-left-color: #1a3a5c; background: #eef2f7; }
  .sidebar .empty { font-size: 12px; color: #ccc; font-style: italic; padding: 4px 10px; margin: 0; }

  .main { flex: 1; min-width: 0; background: #fff; border: 1px solid #e0e0e0; border-radius: 8px; padding: 28px 32px; }

  h1 { font-size: 20px; color: #1a3a5c; margin: 0 0 4px 0; }
  .last-updated { font-size: 12px; color: #aaa; margin-bottom: 28px; }
  .toc { margin-bottom: 28px; }
  .toc h2 { font-size: 12px; text-transform: uppercase; letter-spacing: 0.07em; color: #999; margin: 0 0 10px 0; border-bottom: 1px solid #eee; padding-bottom: 6px; }
  .toc h3 { font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; color: #bbb; margin: 14px 0 6px 0; }
  .toc ul { margin: 0; padding: 0; list-style: none; }
  .toc li { padding: 4px 0 4px 12px; border-left: 2px solid #e0e0e0; margin-bottom: 2px; }
  .toc li a { font-size: 13px; color: #1a3a5c; text-decoration: none; }
  .toc li a:hover { text-decoration: underline; }
  .toc .empty { font-size: 13px; color: #ccc; font-style: italic; padding-left: 12px; }
  .divider { border: none; border-top: 1px solid #eee; margin: 0 0 24px 0; }

  .board { border: 1px solid #d0d8e4; border-radius: 6px; padding: 22px 26px; margin-bottom: 20px; background: #fafcff; scroll-margin-top: 40px; }
  .board.plus-only { border-color: #d4c8a0; background: #fffdf5; }
  .board h3 { font-size: 15px; color: #1a3a5c; margin: 0 0 4px 0; }
  .entry-meta { font-size: 12px; color: #666; margin-bottom: 18px; padding-bottom: 14px; border-bottom: 1px solid #dde3eb; }
  .page-ref { color: #222; font-weight: bold; }
  .badge { display: inline-block; font-size: 11px; padding: 2px 8px; border-radius: 10px; font-weight: bold; background: #d4edda; color: #155724; }
  .sub-label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.07em; color: #222; font-weight: 600; margin: 20px 0 8px 0; }
  .sub-label::before { content: "• "; }
  .update-img { max-width: 100%; border: 1px solid #dde3eb; border-radius: 4px; display: block; }

  .section-label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: #999; margin: 28px 0 12px 0; }

  p { margin: 10px 0; }
  table { border-collapse: collapse; width: 100%; margin: 14px 0; }
  th, td { border: 1px solid #bbb; padding: 8px 12px; text-align: left; vertical-align: middle; }
  th { background-color: #f0f0f0; font-weight: bold; }
  tr:nth-child(even) td { background: #f4f4f4; }

  footer { margin-top: 32px; font-size: 11px; color: #bbb; text-align: right; }

  .title-row { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 4px; }
  .title-row h1 { margin: 0; }
  .contact-btn { flex-shrink: 0; margin-left: 16px; padding: 6px 14px; font-size: 12px; font-weight: 600; color: #1a3a5c; background: #fff; border: 1.5px solid #1a3a5c; border-radius: 5px; text-decoration: none; white-space: nowrap; line-height: 1.4; }
  .contact-btn:hover { background: #eef2f7; }
  .book-logo { float: right; width: 58%; height: auto; object-fit: contain; margin-right: -3%; margin-top: -4%; }

  @media (max-width: 680px) {
    .page { flex-direction: column; margin: 0; padding: 0; }
    .sidebar { display: none; }
    .main { border-radius: 0; border-left: none; border-right: none; padding: 16px; }
    h1 { font-size: 17px; }
    .board { padding: 14px 16px; }
    .title-row { flex-wrap: wrap; gap: 8px; }
    .book-logo { float: none; width: 55%; margin: 12px auto 0; display: block; }
    th, td { padding: 6px 8px; font-size: 13px; }
  }
</style>
